name: Build and Deploy Backend to CapRover

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}:latest

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image name lowercase
        run: echo "IMAGE_NAME_LC=${IMAGE_NAME,,}" >> $GITHUB_ENV

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.TOKEN_GHCR }}

      - name: Build Docker image
        run: |
          docker build \
            --build-arg DATABASE_URL="postgresql://postgres:postgres@dummy-db:5432/app?schema=public" \
            -t $IMAGE_NAME_LC .

      - name: Push Docker image
        run: docker push $IMAGE_NAME_LC

      - name: Update captain-definition with built image
        run: |
          cat > captain-definition <<EOF
          {
            "schemaVersion": 2,
            "imageName": "${IMAGE_NAME_LC}"
          }
          EOF

      - name: Deploy to CapRover
        uses: caprover/deploy-from-github@v1.1.2
        with:
          server: ${{ secrets.CAPROVER_SERVER }}
          app: ${{ secrets.APP_NAME }}
          token: ${{ secrets.APP_TOKEN }}